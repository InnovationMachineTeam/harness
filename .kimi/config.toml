# Kimi Code не читает проектные файлы хуков: скопируйте блок [[hooks]] ниже в
# ~/.kimi-code/config.toml (или добавьте к существующим записям). Хуки Kimi
# запускаются с cwd = каталогу проекта: обёртка sh -c проверяет наличие
# .guardrails/src/cli.ts, чтобы в чужих проектах хук не запускался.
# Проверка после зеркалирования:
#   echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"}}' | bun .guardrails/src/cli.ts evaluate
# ожидание: exit 2 и причина в stderr.

[[hooks]]
event = "PreToolUse"
matcher = "Bash|Write|Edit|Read|Grep|Glob"
command = "sh -c 'if [ -f .guardrails/src/cli.ts ]; then command -v bun >/dev/null 2>&1 || exit 2; AGENT_RUNTIME=kimi AGENT_RUNTIME_CONFIG=.agents/runtime/kimi/config.json GUARDRAILS_INTEGRATION=runtime:kimi:PreToolUse bun .guardrails/src/cli.ts evaluate; else exit 0; fi'"
timeout = 30

[[hooks]]
event = "PreToolUse"
matcher = "Bash|Grep"
command = "sh -c 'if [ -f tooling/harness/src/cli.ts ] && command -v bun >/dev/null 2>&1; then exec bun tooling/harness/src/cli.ts graphify guard-search; else exit 0; fi'"
timeout = 10
[[hooks]]
event = "PreToolUse"
matcher = "Read|Glob"
command = "sh -c 'if [ -f tooling/harness/src/cli.ts ] && command -v bun >/dev/null 2>&1; then exec bun tooling/harness/src/cli.ts graphify guard-read; else exit 0; fi'"
timeout = 10
[[hooks]]
event = "PreToolUse"
matcher = "Read|Grep"
command = "sh -c 'if [ -f tooling/harness/src/cli.ts ] && command -v bun >/dev/null 2>&1; then exec bun tooling/harness/src/cli.ts serena remind; else exit 0; fi'"
timeout = 10
