apiVersion: harness/v1
kind: Workflow
id: harness-refinement
title: Harness Refinement
description: Рекурсивный рефайнмент обвеса - сбор свидетельств из прогонов, предложения по восьми компонентам обвеса, сценарии контрастивных проб и итог с уроками для библиотеки.
inputs:
  request:
    type: string
    required: true
defaults:
  privacy: metadata
  runtime:
    candidates: [provider:ollama, zcode, cursor]
nodes:
  - id: evidence
    title: Свидетельства обвеса
    phase: research
    description: Собрать свидетельства из lessons-артефактов прогонов, ретроспектив спринтов, библиотеки уроков и статистики; сгруппировать по компонентам обвеса.
    dependsOn: []
    roles: [harness-curator]
    inputControl:
      roles: [harness-curator]
      prompt: "Проверь запрос как тему рефайнмента обвеса. pass - если тема и границы различимы; недостающие источники фиксируй как допущения в задании первого шага, а не возвратом. fail - только если тема не относится к обвесу агента."
      dor:
        - тема рефайнмента сформулирована
        - область обвеса названа или покрывается всеми компонентами
      maxAttempts: 3
    execution:
      prompt: "Собери свидетельства обвеса по теме запроса: lessons-артефакты прогонов (.agents/console/tasks/*/lessons/), ретроспективы спринтов (.agents/sprints/*-retrospective.md), библиотека уроков (.agents/lessons/), статистика прогонов консоли. Сгруппируй по компонентам обвеса (системный промпт, guardrails, память, tool guidance, роли, навыки, скрипты, плагины); для каждого паттерна укажи частоту, стоимость и evidence (прогон, файл, цитата). Пустые области назови явно. Структура ответа: 'Паттерны по компонентам', 'Источники', 'Ограничения данных'. Заверши финальным текстом без вызова инструментов; не создавай файлов."
      confirmPlan: false
    outputs: [evidence]
    runtime: { tier: standard, effort: medium }
    timeoutMs: 900000
    retry: { maxAttempts: 2 }
    resources: { workspace: read }
  - id: propose
    title: Предложения по обвесу
    phase: concept
    description: Сформулировать изменения восьми компонентов обвеса с diff, обоснованием, эффектом и риском.
    dependsOn: [evidence]
    roles: [harness-curator]
    execution:
      prompt: "Пройди по восьми компонентам обвеса (системный промпт AGENTS.md, guardrails, память, tool guidance docs/tools, роли, навыки, скрипты tool.sh, плагины) и предложи изменения по свидетельствам evidence. Для каждого предложения: компонент, конкретный diff или текст, обоснование со ссылкой на свидетельство, ожидаемый эффект, риск, способ проверки. Отдели автоматизируемые изменения от ручных; изменения структурных каталогов и guard оформляй только как предложения оператору. Новые поиски не нужны - строй предложения из evidence. Структура ответа: 'Предложения по компонентам', 'Отклонённые направления'. Заверши финальным текстом; не создавай файлов."
      confirmPlan: false
    outputControl:
      roles: [verifier]
      tests: []
      dod:
        - каждое предложение имеет diff, обоснование, эффект, риск и способ проверки
        - предложения трассируются к свидетельствам evidence
      ac:
        - все восемь компонентов рассмотрены (изменить, дополнить или оставить)
        - автоматизируемые и ручные изменения разделены
      manualReview: false
      maxAttempts: 3
    inputs: [evidence]
    outputs: [proposals]
    runtime: { tier: strong, effort: high }
    timeoutMs: 900000
    retry: { maxAttempts: 1 }
    resources: { workspace: read }
  - id: probe
    title: Сценарии контрастивных проб
    phase: validation
    description: Составить сценарии контрастивных проверок для предложений с риском или неясным эффектом; запуск проб выполняет оператор в консоли.
    dependsOn: [propose]
    roles: [independent-reviewer]
    execution:
      prompt: "Составь сценарии контрастивных проб для предложений из proposals с ощутимым риском или неясным эффектом. Сценарий: задача, варианты обвеса (базовый и 2-4 изменённых: блоки дополнительных инструкций или замены файлов ролей, SKILL.md, AGENTS.md), критерий сравнения поведения. Варианты опирай на принятые уроки библиотеки (.agents/lessons/), если они релевантны. Укажи, какие различия поведения подтвердят или опровергнут предложение. Отметь предложения, для которых проба не нужна (минимальный риск). Структура ответа: 'Сценарии проб', 'Предложения без проверки'. Заверши финальным текстом; не создавай файлов."
      confirmPlan: false
    outputControl:
      roles: [verifier]
      tests: []
      dod:
        - каждый сценарий содержит задачу, различимые варианты и критерий сравнения
        - предложения без проверки названы явно с причиной
      ac:
        - варианты внутри сценария различимы между собой
        - критерий сравнения проверяем по наблюдаемому поведению, без эталона
      manualReview: true
      maxAttempts: 3
    inputs: [proposals]
    outputs: [probe-plans]
    runtime: { tier: strong, effort: high }
    timeoutMs: 900000
    retry: { maxAttempts: 1 }
    resources: { workspace: read }
  - id: compose
    title: Итог рефайнмента
    phase: compose
    description: "Свести итог: принятые изменения, новые уроки библиотеки в формате решающих правил, отклонённые предложения и открытые вопросы."
    dependsOn: [evidence, propose, probe]
    roles: [knowledge-curator]
    execution:
      prompt: "Сведи итог рефайнмента обвеса по evidence, proposals и probe-plans. Разделы ответа: 'Принятые изменения' (что внедрить, по компонентам), 'Новые уроки' - заверши этот раздел блоком ```json со списком уроков: [{\"title\":\"...\",\"statement\":\"При [условие] выполняй [действие], потому что [эффект]\",\"reason\":\"обоснование из свидетельств\",\"target\":\"файл роли, навыка или документации\"}], 'Отклонённые предложения' с причинами, 'Открытые вопросы'. Уроки предназначены для библиотеки .agents/lessons/ (внедрение - оператором через Настройки → Оптимизация → Уроки). Новые поиски не нужны. Заверши финальным текстом; не создавай файлов."
      confirmPlan: false
    outputControl:
      roles: [verifier]
      tests: []
      dod:
        - каждое принятое изменение трассируется к предложению и свидетельству
        - уроки соответствуют формату решающих правил
      ac:
        - разделы 'Принятые изменения', 'Новые уроки', 'Отклонённые предложения', 'Открытые вопросы' присутствуют
        - раздел 'Новые уроки' завершается блоком ```json со списком уроков
      manualReview: true
      maxAttempts: 3
    inputs: [evidence, proposals, probe-plans]
    outputs: [refinement]
    runtime: { tier: strong, effort: high }
    timeoutMs: 900000
    retry: { maxAttempts: 1 }
    resources: { workspace: read }
